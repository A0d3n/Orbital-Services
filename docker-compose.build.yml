# Variante sans image publiée : construit l'image depuis les sources du dépôt.
#   docker compose -f docker-compose.build.yml up -d --build
services:
  orbital-services:
    build: .
    container_name: orbital-services
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # Données de marché UEX (facultatif, désactivé par défaut) : décommentez, voir docs/deploiement.md
      # UEX_ENABLED: "1"
    ports:
      - "9080:8080"
    volumes:
      - ./data:/data
