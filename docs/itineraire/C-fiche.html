<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquette C · Itinéraire depuis la fiche d’un système · Orbital Services</title>
<style>
:root{color-scheme:dark;--bg:#0b0d0c;--bg-2:#111412;--line:#232826;--line-2:#2e3531;--ink:#e7ebe8;--ink-2:#9ca59e;--dim:#858f87;--sage:#b8d9a6;--warn:#e8895a;
--f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-text-size-adjust:100%;overflow-x:hidden;padding-bottom:3.4rem}
body.sheet-open{padding-bottom:45vh;padding-bottom:45dvh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:2px}
.demo{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;padding:.35rem .6rem;border-bottom:1px dashed var(--line);font:400 .7rem var(--m);color:var(--dim)}
.demo button{background:none;border:1px solid var(--line);color:var(--dim);padding:.25rem .5rem;border-radius:2px;font:400 .7rem var(--m);cursor:pointer;min-height:1.9rem}
.demo button:hover{color:var(--ink);border-color:var(--line-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-width:2.75rem;height:2.75rem;padding:0 .8rem;background:transparent;border:1px solid var(--line-2);border-radius:2px;cursor:pointer;font:500 .85rem/1 var(--f)}
.btn:hover{border-color:var(--sage);color:var(--sage)}
.btn.pri{background:var(--sage);color:var(--bg);border-color:var(--sage)}
.btn.pri:hover{color:var(--bg);filter:brightness(1.1)}
.fl{margin:0 0 .4rem;font:400 .72rem var(--m);letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}

.app{display:flex;flex-direction:column}
.center{display:flex;flex-direction:column;min-width:0;flex:1}
.mapbox{position:relative;height:min(46svh,480px);min-height:270px;border-bottom:1px solid var(--line);overflow:hidden;
 background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(ellipse at 50% 45%,#10151a,#07090a 80%)}
#map{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#map:focus-visible{outline-offset:-3px}
.fit{position:absolute;top:.5rem;right:.5rem;width:2.75rem;height:2.75rem;display:grid;place-items:center;background:rgba(11,13,12,.8);border:1px solid var(--line-2);border-radius:2px;cursor:pointer;color:var(--ink-2)}
.fit:hover{color:var(--sage);border-color:var(--sage)}
@media (min-width:1000px){
 .app{flex-direction:row;height:calc(100vh - 2.7rem);min-height:660px}
 .mapbox{height:auto;flex:1;border-bottom:0}
 body,body.sheet-open{padding-bottom:0}
}

.eg{stroke:#5d6b62;stroke-width:1.1;fill:none}
.eg.d{stroke-dasharray:3 4}
.rh{stroke:var(--sage);stroke-width:10;opacity:.13;stroke-linecap:round}
.rt{stroke:var(--sage);stroke-width:4.2;stroke-linecap:round}
.rt.d{stroke-dasharray:9 6;stroke-linecap:butt}
.bd,.tg{pointer-events:none}
.bd circle{fill:var(--bg);stroke:var(--sage);stroke-width:1.3}
.bd text{font:500 10px var(--m);fill:var(--sage);text-anchor:middle;dominant-baseline:central}
.nd{cursor:pointer}
.nd .hit{fill:transparent}
.nd .sh{fill:var(--bg);stroke:#cfd8d1;stroke-width:1.2}
.nd.no .sh{stroke:#7b857e;stroke-dasharray:2 2}
.nd.on .sh{fill:var(--sage);stroke:var(--sage)}
.nd:hover .sh{stroke:var(--sage)}
.nd text{font:500 10.5px var(--f);letter-spacing:.06em;text-transform:uppercase;fill:#cfd8d1;text-anchor:middle;paint-order:stroke;stroke:#07090a;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.nd.on text,.nd.end text{fill:#fff}
.ring{display:none;fill:none}
.nd.end .ring{display:block;stroke:var(--sage);stroke-width:1.2}
#map:focus-visible .nd.cur .ring{display:block;stroke:#fff;stroke-width:1.3;stroke-dasharray:2 2.5}

.tc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4rem .9rem;align-items:center;padding:.7rem max(.8rem,2vw);border-top:1px solid var(--line-2);background:linear-gradient(180deg,rgba(184,217,166,.07),transparent)}
.yr small{display:block;font:400 .62rem var(--m);letter-spacing:.2em;color:var(--ink-2)}
.yr output{display:block;font:400 2rem/1 var(--m);color:var(--sage);font-variant-numeric:tabular-nums}
.tc .row{display:flex;gap:.4rem;align-items:center;min-width:0}
.tc input[type=range]{flex:1;min-width:0;accent-color:var(--sage);height:2.2rem;margin:0}
.tc .btn{min-width:2.75rem;padding:0}
.lg{padding:.2rem max(.8rem,2vw) .8rem;font-size:.78rem;color:var(--ink-2)}
.lg summary{cursor:pointer;min-height:2.4rem;display:flex;align-items:center;font:400 .7rem var(--m);letter-spacing:.16em;text-transform:uppercase}
.lg ul{list-style:none;margin:.2rem 0 .4rem;padding:0;display:flex;flex-wrap:wrap;gap:.35rem 1rem}
.lg li{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}
.lg p{margin:.2rem 0 0;color:var(--dim);font-size:.72rem;max-width:70ch;overflow-wrap:anywhere}

/* C : fiche (volet bas sur mobile, colonne de droite sur grand écran) */
.panel{background:var(--bg-2);border-top:1px solid var(--line-2)}
.sheet-h{display:flex;align-items:center;gap:.7rem;width:100%;min-height:3.2rem;padding:.4rem .9rem;background:var(--bg-2);border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;flex:none}
.sheet-h .t{font:500 .72rem var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.sheet-h .sm{flex:1;min-width:0;font-size:.9rem;color:var(--sage);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.sheet-h svg{flex:none;transition:transform .2s}
.sheet-h[aria-expanded=true] svg{transform:rotate(180deg)}
.pbody{padding:1rem .95rem 1.5rem;overflow:auto;min-height:0}
@media (max-width:999px){
 .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:45vh;max-height:45dvh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.55)}
 .panel[data-open=false] .pbody{display:none}
}
@media (min-width:1000px){
 .sheet-h{display:none}
 .panel{width:22rem;flex:none;border-top:0;border-left:1px solid var(--line);overflow:auto}
}
.pbody h2{margin:0 0 .15rem;font:700 1.7rem/1.1 var(--f);overflow-wrap:anywhere}
.meta{margin:0 0 .9rem;font:400 .78rem var(--m);color:var(--ink-2);overflow-wrap:anywhere}
.skel{display:grid;gap:.45rem;margin:0 0 1.1rem}
.skel i{display:block;height:.6rem;background:var(--line);border-radius:1px}
.skel i:nth-child(1){width:92%}.skel i:nth-child(2){width:74%}.skel i:nth-child(3){width:58%}
.go{width:100%;justify-content:space-between}
.go svg{transition:transform .2s}
.go[aria-expanded=true] svg{transform:rotate(180deg)}
.rtc{margin-top:.8rem;border:1px solid var(--line-2);background:rgba(0,0,0,.25);padding:.9rem}
.rtc[hidden]{display:none}
.fld label{display:block;font:400 .68rem var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-bottom:.25rem}
.fld input{width:100%;height:2.75rem;padding:0 .8rem;background:rgba(0,0,0,.35);border:1px solid var(--line-2);border-radius:2px;font:400 1rem var(--f);color:var(--ink)}
.fld input:focus{outline:2px solid var(--sage);outline-offset:1px;border-color:var(--sage)}
.lb{list-style:none;margin:.25rem 0 0;padding:0;max-height:10rem;overflow:auto;border:1px solid var(--line-2);background:var(--bg)}
.lb[hidden]{display:none}
.lb li{display:flex;justify-content:space-between;align-items:center;gap:.6rem;min-height:2.6rem;padding:.4rem .8rem;border-left:2px solid transparent;cursor:pointer}
.lb li[aria-selected=true]{background:rgba(184,217,166,.11);border-left-color:var(--sage)}
.lb li em{font:400 .7rem var(--m);font-style:normal;color:var(--dim);text-align:right}
.lb li.none{color:var(--ink-2);cursor:default}
#fres{margin-top:.9rem}
.sumb{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .8rem;margin-bottom:.5rem}
.sumb .big{font:500 1.7rem/1.1 var(--m);color:var(--sage)}
.sumb span{color:var(--ink-2);font-size:.85rem;overflow-wrap:anywhere}

/* frise verticale */
.frise{list-style:none;margin:0;padding:0}
.frise li{position:relative}
.frise li:not(:first-child)::before,.frise li:not(:last-child)::after{content:"";position:absolute;left:.62rem;border-left:2px solid var(--sage)}
.frise li:not(:first-child)::before{top:0;height:1.3rem}
.frise li:not(:last-child)::after{top:1.3rem;bottom:0}
.frise li.dp::before,.frise li.dn::after{border-left-style:dashed}
.fz{display:block;position:relative;width:100%;min-height:3rem;padding:.5rem .4rem .6rem 2.1rem;background:none;border:0;border-radius:2px;text-align:left;cursor:pointer}
.fz:hover{background:rgba(184,217,166,.07)}
.fz i{position:absolute;left:.3rem;top:.95rem;width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--sage);background:var(--bg);z-index:1}
.frise li:first-child .fz i,.frise li.last .fz i{background:var(--sage)}
.fz .n{display:flex;align-items:center;gap:.5rem;font-weight:500;overflow-wrap:anywhere}
.fz u{text-decoration:none;font:500 .72rem var(--m);color:var(--sage)}
.fz .s{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .5rem;font:400 .74rem var(--m);color:var(--ink-2)}
.ded{font:400 .66rem var(--m);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:1px dashed var(--line-2);padding:.1rem .35rem;border-radius:2px;white-space:nowrap}
.note{margin:.7rem 0 0;font-size:.76rem;color:var(--dim)}
.err{border:1px solid var(--line-2);border-left:3px solid var(--warn);padding:.8rem .9rem;background:rgba(232,137,90,.06)}
.err b{display:block;font-size:1.05rem;margin-bottom:.2rem;overflow-wrap:anywhere}
.err p{margin:0 0 .7rem;color:var(--ink-2);font-size:.9rem;overflow-wrap:anywhere}
.err p:last-child{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="demo" role="group" aria-label="Démonstration (hors maquette)">
  <span>Démo :</span>
  <button type="button" data-demo="found">Route trouvée</button>
  <button type="button" data-demo="none">Aucune route (2900)</button>
  <button type="button" data-demo="nojump">Sans point de saut (Virgo)</button>
</div>

<div class="app">
  <main class="center">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 400 300" role="application" aria-roledescription="carte" aria-label="Mini-carte schématique. Flèches : système voisin. Entrée : ouvrir la fiche. 0 : vue d’ensemble." tabindex="0"></svg>
      <button type="button" class="fit" id="fit" aria-label="Vue d’ensemble" title="Vue d’ensemble (0)">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4"/></svg>
      </button>
    </div>
    <section class="tc" aria-label="Console du temps">
      <div class="yr"><small>ANNÉE</small><output id="yr" for="rng">2956</output></div>
      <div class="row">
        <button type="button" class="btn" id="ym" aria-label="Année précédente">−</button>
        <input type="range" id="rng" min="2400" max="2956" step="1" value="2956" aria-label="Année affichée">
        <button type="button" class="btn" id="yp" aria-label="Année suivante">+</button>
      </div>
    </section>
    <details class="lg" id="legend"></details>
  </main>

  <aside class="panel" id="panel" data-open="false" aria-label="Fiche du système">
    <button type="button" class="sheet-h" id="sheetH" aria-expanded="false" aria-controls="pbody">
      <span class="t">Fiche</span><span class="sm" id="miniSum"></span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>
    </button>
    <div class="pbody" id="pbody">
      <p class="fl">Système</p>
      <h2 id="fn">Sol</h2>
      <p class="meta" id="fm"></p>
      <div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>
      <button type="button" class="btn pri go" id="go" aria-expanded="false" aria-controls="rtc">
        <span>Itinéraire vers…</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>
      </button>

      <section class="rtc" id="rtc" aria-label="Itinéraire depuis ce système" hidden>
        <div class="fld">
          <label for="cd">Destination</label>
          <input id="cd" type="text" role="combobox" aria-expanded="false" aria-controls="ld" aria-autocomplete="list" aria-activedescendant="" autocomplete="off" spellcheck="false" enterkeyhint="go" placeholder="Système d’arrivée">
          <ul class="lb" id="ld" role="listbox" aria-label="Suggestions de destination" hidden></ul>
        </div>
        <div id="fres" aria-live="polite"></div>
      </section>
    </div>
  </aside>
</div>

<script>
/* ===== Noyau commun (identique dans les 3 maquettes, sauf TAGS) ===== */
const TAGS=false;
const $=s=>document.querySelector(s);
const S={sol:["Sol",70,170],davien:["Davien",130,112],cano:["Cano",195,84],pyro:["Pyro",252,136],stanton:["Stanton",335,98],hadrian:["Hadrian",256,214],kiel:["Kiel",192,252],baker:["Baker",125,262],hadur:["Hadur",58,252],croshaw:["Croshaw",40,100],terra:["Terra",340,190],virgo:["Virgo",352,36]};
const DISC={pyro:2493,stanton:2903,terra:2516};          /* années réelles */
const NOJ=["virgo"];                                     /* sans point de saut publié */
/* [de, vers, ouverture, déduite] : liaisons et années illustratives, sauf découvertes ci-dessus */
const L=[["sol","davien",2438,0],["davien","cano",2460,0],["cano","pyro",2493,0],["pyro","stanton",2903,0],["pyro","hadrian",2510,0],["hadrian","kiel",2600,1],["kiel","baker",2620,0],["baker","hadur",2640,0],["sol","croshaw",2438,0],["pyro","terra",2516,1]];
const st={y:2956,a:"sol",b:"stanton"},hooks={};
const nm=id=>S[id][0];
const known=(id,y)=>y>=(DISC[id]||0);
const act=(l,y)=>y>=l[2]&&(!l[4]||y<l[4])&&known(l[0],y)&&known(l[1],y);
const plural=n=>n+" saut"+(n>1?"s":"");
function route(a,b,y){
  if(a===b)return{err:"same"};
  for(const id of [a,b]){if(!known(id,y))return{err:"undisc",id};if(NOJ.includes(id))return{err:"nojump",id};}
  const adj={};
  L.forEach((l,i)=>{if(act(l,y)){(adj[l[0]]=adj[l[0]]||[]).push([l[1],i]);(adj[l[1]]=adj[l[1]]||[]).push([l[0],i]);}});
  const prev={[a]:null},q=[a];
  while(q.length){const c=q.shift();if(c===b)break;for(const [n,i] of adj[c]||[])if(!(n in prev)){prev[n]=[c,i];q.push(n);}}
  if(!(b in prev))return{err:"none"};
  const hops=[];let c=b;
  while(prev[c]){const [p,i]=prev[c];hops.unshift({a:p,b:c,open:L[i][2],ded:!!L[i][3]});c=p;}
  return{hops};
}
function errText(r){
  if(r.err==="undisc")return{t:"Aucune route en "+st.y,d:nm(r.id)+" n’est découvert qu’en "+DISC[r.id]+".",cta:st.y<2956};
  if(r.err==="nojump")return{t:"Aucune route",d:nm(r.id)+" n’a aucun point de saut publié."};
  if(r.err==="same")return{t:"Départ et arrivée identiques",d:"Choisissez deux systèmes différents."};
  return{t:"Aucune route en "+st.y,d:"Aucune suite de liaisons actives ne relie ces deux systèmes à cette année.",cta:st.y<2956};
}
const ctaHTML='<button type="button" class="btn pri" data-act="y2956">Voir en 2956</button>';
const NOTE='<p class="note">Taille des points de saut : donnée non disponible</p>';
const svg=$("#map");let cur="sol",last=null;
let view={x:0,y:0,w:400,h:300};
const rm=matchMedia("(prefers-reduced-motion:reduce)");
const setVB=()=>svg.setAttribute("viewBox",view.x+" "+view.y+" "+view.w+" "+view.h);
function go(t){
  if(rm.matches){view=t;setVB();return;}
  const f={...view},t0=performance.now();
  (function s(n){const k=Math.min(1,(n-t0)/350),e=1-Math.pow(1-k,3);
    view={x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,w:f.w+(t.w-f.w)*e,h:f.h+(t.h-f.h)*e};setVB();
    if(k<1)requestAnimationFrame(s);})(t0);
}
function focusOn(x,y,z){z=z||1.8;const w=400/z,h=300/z;go({x:x-w/2,y:y-h/2,w:w,h:h});}
const resetView=()=>go({x:0,y:0,w:400,h:300});
function draw(r){
  const y=st.y;let e="",rt="",n="",bd="";const on=new Set();
  L.forEach(l=>{if(act(l,y)){const a=S[l[0]],b=S[l[1]];e+='<line class="eg'+(l[3]?' d':'')+'" x1="'+a[1]+'" y1="'+a[2]+'" x2="'+b[1]+'" y2="'+b[2]+'"/>';}});
  ((r&&r.hops)||[]).forEach((h,i)=>{
    const a=S[h.a],b=S[h.b];on.add(h.a);on.add(h.b);
    const p='x1="'+a[1]+'" y1="'+a[2]+'" x2="'+b[1]+'" y2="'+b[2]+'"';
    rt+='<line class="rh" '+p+'/><line class="rt'+(h.ded?' d':'')+'" '+p+'/>';
    bd+='<g class="bd" transform="translate('+(a[1]+b[1])/2+' '+(a[2]+b[2])/2+')"><circle r="8.5"/><text>'+(i+1)+'</text></g>';
  });
  for(const id in S){
    if(!known(id,y))continue;
    const c=S[id],cl=["nd"];
    if(NOJ.includes(id))cl.push("no");if(on.has(id))cl.push("on");if(id===st.a||id===st.b)cl.push("end");if(id===cur)cl.push("cur");
    n+='<g class="'+cl.join(" ")+'" id="n-'+id+'" data-id="'+id+'" role="button" aria-label="'+c[0]+'" transform="translate('+c[1]+' '+c[2]+')"><circle class="hit" r="15"/><circle class="ring" r="11"/><circle class="sh" r="5.5"/><text y="19">'+c[0]+'</text></g>';
  }
  svg.innerHTML=e+rt+n+bd;
  svg.setAttribute("aria-activedescendant","n-"+cur);
}
function mark(){
  svg.querySelectorAll(".cur").forEach(x=>x.classList.remove("cur"));
  const g=$("#n-"+cur);if(g)g.classList.add("cur");
  svg.setAttribute("aria-activedescendant","n-"+cur);
}
svg.addEventListener("click",e=>{const g=e.target.closest(".nd");if(g){cur=g.dataset.id;mark();hooks.pick&&hooks.pick(cur,e);}});
svg.addEventListener("keydown",e=>{
  const D={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(D[e.key]){
    e.preventDefault();const d=D[e.key],c=S[cur];let best=null,bs=1e9;
    for(const id in S){
      if(id===cur||!known(id,st.y))continue;
      const dx=S[id][1]-c[1],dy=S[id][2]-c[2],dot=dx*d[0]+dy*d[1];if(dot<=0)continue;
      const dist=Math.hypot(dx,dy),sc=dist*(1+(1-dot/dist)*2);if(sc<bs){bs=sc;best=id;}
    }
    if(best){cur=best;mark();}
  }else if(e.key==="Enter"||e.key===" "){e.preventDefault();hooks.pick&&hooks.pick(cur,e);}
  else if(e.key==="0")resetView();
});
$("#fit").onclick=resetView;
function setYear(v){st.y=Math.max(2400,Math.min(2956,v|0));update();}
$("#ym").onclick=()=>setYear(st.y-1);$("#yp").onclick=()=>setYear(st.y+1);
$("#rng").oninput=e=>setYear(+e.target.value);
document.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==="["||e.key==="PageDown")setYear(st.y-1);else if(e.key==="]"||e.key==="PageUp")setYear(st.y+1);
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-hop],[data-sys],[data-demo]");if(!t)return;
  if(t.dataset.act==="y2956")setYear(2956);
  if(t.dataset.sys){const c=S[t.dataset.sys];focusOn(c[1],c[2],2);}
  if(t.dataset.demo){
    const k=t.dataset.demo;
    if(k==="found"){st.y=2956;st.a="sol";st.b="stanton";}
    if(k==="none"){st.y=2900;st.a="sol";st.b="stanton";}
    if(k==="nojump"){st.y=2956;st.a="sol";st.b="virgo";}
    resetView();hooks.demo&&hooks.demo(k);update();
  }
});
function update(){
  if(!known(cur,st.y))cur="sol";
  last=(st.a&&st.b)?route(st.a,st.b,st.y):null;
  draw(last);
  $("#yr").textContent=st.y;$("#rng").value=st.y;
  hooks.render&&hooks.render(last);
}
function combo(o){
  const inp=o.input,ul=o.list;let items=[],idx=-1,openF=false;
  const norm=s=>s.normalize("NFD").replace(new RegExp("[\\u0300-\\u036f]","g"),"").toLowerCase();
  const tag=id=>!known(id,st.y)?"découvert en "+DISC[id]:NOJ.includes(id)?"aucun point de saut":"";
  function build(q){
    const n=norm(q);
    items=Object.keys(S).filter(id=>norm(S[id][0]).includes(n)).sort((a,b)=>(norm(S[a][0]).startsWith(n)?0:1)-(norm(S[b][0]).startsWith(n)?0:1)||S[a][0].localeCompare(S[b][0]));
    ul.innerHTML=items.length?items.map((id,i)=>'<li role="option" id="'+ul.id+'-'+i+'" data-i="'+i+'" aria-selected="false"><span>'+S[id][0]+'</span><em>'+tag(id)+'</em></li>').join(""):'<li class="none" role="presentation">Aucun système ne correspond</li>';
    idx=-1;inp.setAttribute("aria-activedescendant","");
  }
  function open(q){build(q);ul.hidden=false;openF=true;inp.setAttribute("aria-expanded","true");}
  function close(){ul.hidden=true;openF=false;idx=-1;inp.setAttribute("aria-expanded","false");inp.setAttribute("aria-activedescendant","");}
  function restore(){inp.value=o.get()?nm(o.get()):"";}
  function setIdx(i){
    if(!items.length)return;idx=(i+items.length)%items.length;
    ul.querySelectorAll("[role=option]").forEach((li,k)=>li.setAttribute("aria-selected",k===idx?"true":"false"));
    const li=ul.children[idx];inp.setAttribute("aria-activedescendant",li.id);li.scrollIntoView({block:"nearest"});
  }
  function pick(id){inp.value=nm(id);close();o.pick(id);}
  inp.addEventListener("focus",()=>{inp.select();open("");});
  inp.addEventListener("input",()=>open(inp.value));
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();if(!openF)open("");else setIdx(idx+1);}
    else if(e.key==="ArrowUp"){e.preventDefault();if(!openF)open("");else setIdx(idx<0?items.length-1:idx-1);}
    else if(e.key==="Home"&&openF){e.preventDefault();setIdx(0);}
    else if(e.key==="End"&&openF){e.preventDefault();setIdx(items.length-1);}
    else if(e.key==="Enter"){if(openF){e.preventDefault();if(idx>=0)pick(items[idx]);else if(items.length===1)pick(items[0]);}}
    else if(e.key==="Escape"){if(openF){e.preventDefault();e.stopPropagation();close();restore();}}
    else if(e.key==="Tab"){close();restore();}
  });
  inp.addEventListener("blur",()=>setTimeout(()=>{if(document.activeElement!==inp){close();restore();}},120));
  ul.addEventListener("mousedown",e=>e.preventDefault());
  ul.addEventListener("click",e=>{const li=e.target.closest("[data-i]");if(li)pick(items[+li.dataset.i]);});
  return{sync(){if(document.activeElement!==inp)restore();}};
}

  if(matchMedia("(min-width:1000px)").matches)$("#legend").open=true;
})();
/* ===== Fin du noyau ===== */

/* ===== Option C : itinéraire intégré à la fiche ===== */
let rtOpen=false;
const panel=$("#panel"),sheetH=$("#sheetH"),goB=$("#go"),rtc=$("#rtc"),isDesk=()=>matchMedia("(min-width:1000px)").matches;
const CD=combo({input:$("#cd"),list:$("#ld"),get:()=>st.b,pick:id=>{st.b=id;update();}});
function setSheet(o){
  panel.dataset.open=o;sheetH.setAttribute("aria-expanded",o);
  document.body.classList.toggle("sheet-open",o&&!isDesk());
}
function setRt(o){rtOpen=o;goB.setAttribute("aria-expanded",o);rtc.hidden=!o;}
sheetH.onclick=()=>setSheet(panel.dataset.open!=="true");
goB.onclick=()=>{setRt(!rtOpen);if(rtOpen)setTimeout(()=>$("#cd").focus(),0);};
hooks.pick=id=>{st.a=id;if(st.b===id)st.b=null;setSheet(true);update();};
hooks.demo=()=>{setRt(true);setSheet(true);};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&rtOpen&&!e.defaultPrevented){setRt(false);goB.focus();}
});
function frise(r){
  const H=r.hops;
  let h='<ol class="frise" aria-label="Étapes de l’itinéraire">'
   +'<li class="'+(H[0].ded?'dn':'')+'"><button type="button" class="fz" data-sys="'+st.a+'"><i></i><span class="n">'+nm(st.a)+'</span><span class="s">Départ</span></button></li>';
  H.forEach((p,i)=>{
    const nx=H[i+1],last=i===H.length-1;
    h+='<li class="'+(p.ded?'dp ':'')+(nx&&nx.ded?'dn ':'')+(last?'last':'')+'"><button type="button" class="fz" data-sys="'+p.b+'" aria-label="Étape '+(i+1)+' : '+nm(p.b)+(last?', arrivée':'')+'. Centrer la carte."><i></i><span class="n"><u>'+(i+1)+'</u>'+nm(p.b)+'</span><span class="s">Saut ouvert en '+p.open+(p.ded?' <em class="ded">liaison déduite</em>':'')+'</span></button></li>';
  });
  return h+'</ol>';
}
hooks.render=r=>{
  CD.sync();
  const a=st.a;
  $("#fn").textContent=nm(a);
  const n=L.filter(l=>act(l,st.y)&&(l[0]===a||l[1]===a)).length;
  $("#fm").textContent=!known(a,st.y)?"Pas encore découvert en "+st.y+" (découverte : "+DISC[a]+")":NOJ.includes(a)?"Aucun point de saut publié":n+" liaison"+(n>1?"s":"")+" active"+(n>1?"s":"")+" en "+st.y;
  let h="",mini=nm(a)+" · Itinéraire vers…";
  if(!st.b){h=NOJ.includes(a)?'<div class="err"><b>Aucune route</b><p>'+nm(a)+' n’a aucun point de saut publié.</p></div>':'<p class="note">Choisissez une destination.</p>';}
  else if(r.hops){
    h='<div class="sumb"><b class="big">'+plural(r.hops.length)+'</b><span>'+nm(a)+' → '+nm(st.b)+' · en '+st.y+'</span></div>'+frise(r)
     +'<p class="note">Années d’ouverture : valeurs de maquette.</p>'+NOTE;
    mini=nm(a)+' → '+nm(st.b)+' · '+plural(r.hops.length);
  }else{
    const m=errText(r);
    h='<div class="err"><b>'+m.t+'</b><p>'+m.d+'</p>'+(m.cta?ctaHTML:'')+'</div>';
    mini=nm(a)+' → '+nm(st.b)+' · '+m.t.toLowerCase();
  }
  $("#fres").innerHTML=h;$("#miniSum").textContent=mini;
};
setSheet(isDesk());setRt(isDesk());
update();
