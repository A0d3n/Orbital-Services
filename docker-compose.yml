# TrueNAS SCALE 24.10+ : Apps → Discover Apps → Custom App → « Install via YAML »
# Remplacez /mnt/POOL/apps/orbital-services/data par le chemin réel de votre dataset.
# L'image contient déjà le serveur et la page : seul le dossier des données est monté.
services:
  orbital-services:
    image: ghcr.io/a0d3n/orbital-services:dev      # ou :latest quand main est publié
    container_name: orbital-services
    restart: unless-stopped
    pull_policy: always                             # récupère la dernière image à chaque démarrage
    user: "568:568"                                 # utilisateur « apps » de TrueNAS
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # Pour protéger l'accès par mot de passe, décommentez ces deux lignes :
      # AUTH_USER: orbital
      # AUTH_PASSWORD: choisissez-un-mot-de-passe
    ports:
      - "9080:8080"                                 # accès : http://IP-DU-NAS:9080
    volumes:
      - /mnt/POOL/apps/orbital-services/data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
